<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 760" width="1400" height="760">
  <defs>
    <!-- Hiệu ứng nét chì/sáp màu nhẹ -->
    <filter id="crayon" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>

    <!-- Thân thỏ (không có mặt) -->
    <g id="bunny" stroke="#8A5236" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- Tai trái -->
      <path d="M145 195 C110 150 80 80 100 45 C115 25 140 35 155 60 C175 95 188 140 188 182 Z" fill="#F8ECE6"/>
      <path d="M150 170 C125 135 108 85 118 62 C130 50 145 70 155 95 C165 120 172 150 170 172 Z" fill="#EBCDBD" stroke="#F2A889" stroke-width="3"/>
      <!-- Tai phải (cụp nhẹ ra ngoài) -->
      <path d="M212 182 C225 140 250 95 290 75 C320 60 345 70 340 95 C335 120 300 150 258 195 Z" fill="#F8ECE6"/>
      <path d="M228 170 C245 135 265 105 292 92 C312 84 325 92 318 108 C308 128 280 150 250 175 Z" fill="#EBCDBD" stroke="#F2A889" stroke-width="3"/>

      <!-- Thân -->
      <path d="M140 335 C132 380 132 420 138 445 L262 445 C268 420 268 380 260 335 Z" fill="#F8ECE6"/>
      <!-- Áo vest -->
      <path d="M141 338 C134 375 134 405 138 428 L262 428 C266 405 266 375 259 338 Z" fill="#4B4648" stroke="none"/>
      <path d="M172 338 L200 392 L228 338 Z" fill="#FFF7F0" stroke="none"/>
      <path d="M172 338 L190 378 M228 338 L210 378" fill="none" stroke="#2F2B2D" stroke-width="3"/>
      <!-- Cà vạt -->
      <path d="M194 344 L206 344 L203 356 L210 390 L200 402 L190 390 L197 356 Z" fill="#A65A33" stroke="#7A3F22" stroke-width="2.5"/>
      <!-- Viền thân vẽ lại trên áo -->
      <path d="M140 335 C132 380 132 420 138 445 M260 335 C268 380 268 420 262 445" fill="none"/>
      <!-- Thẻ nhân viên -->
      <rect x="228" y="347" width="16" height="21" rx="3" fill="#FFFFFF" stroke-width="2.5"/>
      <rect x="229.5" y="348.5" width="13" height="5" fill="#5B8FD6" stroke="none"/>
      <path d="M232 358 H240 M232 363 H238" stroke="#B9A79C" stroke-width="2"/>
      <!-- Tay -->
      <path d="M147 352 C150 378 160 394 176 400 M253 352 C250 378 240 394 224 400" fill="none" stroke-width="5"/>
      <ellipse cx="184" cy="401" rx="15" ry="13" fill="#F8ECE6" stroke-width="5"/>
      <ellipse cx="216" cy="401" rx="15" ry="13" fill="#F8ECE6" stroke-width="5"/>
      <!-- Chân -->
      <ellipse cx="168" cy="447" rx="27" ry="11" fill="#F8ECE6"/>
      <ellipse cx="232" cy="447" rx="27" ry="11" fill="#F8ECE6"/>

      <!-- Đầu -->
      <path d="M95 300 C80 250 105 200 150 185 C175 172 225 172 250 185 C295 200 320 250 305 300 C315 320 300 345 270 345 L130 345 C100 345 85 320 95 300 Z" fill="#F8ECE6"/>
    </g>

    <!-- Má hồng -->
    <g id="blush">
      <ellipse cx="135" cy="302" rx="23" ry="13" fill="#F3B6A3" opacity="0.75"/>
      <ellipse cx="265" cy="302" rx="23" ry="13" fill="#F3B6A3" opacity="0.75"/>
      <path d="M124 306 l6 -9 M133 309 l6 -9 M142 310 l6 -9 M254 306 l6 -9 M263 309 l6 -9 M272 310 l6 -9" stroke="#E58E78" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="sparkle"><path d="M0 -14 Q2 -2 14 0 Q2 2 0 14 Q-2 2 -14 0 Q-2 -2 0 -14 Z" fill="#F6C453" stroke="#D99A2B" stroke-width="1.5"/></g>
  </defs>

  <rect width="1400" height="760" fill="#FFFBF6"/>
  <text x="48" y="64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="34" font-weight="700" fill="#6B3F28">小兔 Xiǎo Tù · 采购部实习生</text>
  <text x="48" y="100" font-family="Segoe UI, sans-serif" font-size="18" fill="#9A7766">Nhân vật chính · bản thiết kế 1</text>

  <!-- ===== Tư thế chính: vui vẻ ===== -->
  <g transform="translate(60 100) scale(1.28)" filter="url(#crayon)">
    <use href="#bunny"/>
    <use href="#blush"/>
    <g stroke="#8A5236" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="160" cy="270" rx="9" ry="12" fill="#4A2C1E" stroke="none"/>
      <ellipse cx="240" cy="270" rx="9" ry="12" fill="#4A2C1E" stroke="none"/>
      <circle cx="157" cy="265" r="3.2" fill="#fff" stroke="none"/>
      <circle cx="237" cy="265" r="3.2" fill="#fff" stroke="none"/>
      <path d="M186 289 Q193 298 200 290 Q207 298 214 289" fill="none" stroke-width="4"/>
      <path d="M190 296 Q200 324 210 296 Q200 302 190 296 Z" fill="#F29C9C" stroke-width="4"/>
    </g>
  </g>
  <text x="310" y="735" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#6B3F28">开心 · Vui vẻ (mặc định)</text>

  <!-- ===== Biểu cảm: suy nghĩ ===== -->
  <g transform="translate(600 200) scale(0.75)" filter="url(#crayon)">
    <use href="#bunny"/>
    <use href="#blush" opacity="0.6"/>
    <g stroke="#8A5236" stroke-linecap="round" fill="none">
      <ellipse cx="156" cy="266" rx="7" ry="9" fill="#4A2C1E" stroke="none"/>
      <ellipse cx="236" cy="266" rx="7" ry="9" fill="#4A2C1E" stroke="none"/>
      <circle cx="154" cy="262" r="2.5" fill="#fff" stroke="none"/>
      <circle cx="234" cy="262" r="2.5" fill="#fff" stroke="none"/>
      <path d="M142 246 Q156 240 170 247 M222 247 Q236 240 250 246" stroke-width="4"/>
      <path d="M186 300 Q193 295 200 300 Q207 305 214 300" stroke-width="4"/>
      <path d="M300 222 C293 235 293 243 300 245 C307 243 307 235 300 222 Z" fill="#CFE6F5" stroke="#7FB3D5" stroke-width="3"/>
    </g>
    <text x="330" y="190" font-family="Segoe UI, sans-serif" font-size="64" font-weight="700" fill="#8A5236">?</text>
  </g>
  <text x="750" y="580" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#6B3F28">思考 · Suy nghĩ</text>

  <!-- ===== Biểu cảm: bất ngờ ===== -->
  <g transform="translate(860 200) scale(0.75)" filter="url(#crayon)">
    <use href="#bunny"/>
    <use href="#blush" opacity="0.5"/>
    <g stroke="#8A5236" stroke-linecap="round">
      <circle cx="160" cy="268" r="13" fill="#4A2C1E" stroke="none"/>
      <circle cx="240" cy="268" r="13" fill="#4A2C1E" stroke="none"/>
      <circle cx="156" cy="263" r="4.5" fill="#fff" stroke="none"/>
      <circle cx="236" cy="263" r="4.5" fill="#fff" stroke="none"/>
      <ellipse cx="200" cy="303" rx="8" ry="10" fill="#F29C9C" stroke-width="4"/>
    </g>
    <text x="325" y="190" font-family="Segoe UI, sans-serif" font-size="64" font-weight="700" fill="#D9603B">!</text>
  </g>
  <text x="1010" y="580" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#6B3F28">惊讶 · Bất ngờ</text>

  <!-- ===== Biểu cảm: hoàn thành nhiệm vụ ===== -->
  <g transform="translate(1120 200) scale(0.75)" filter="url(#crayon)">
    <use href="#bunny"/>
    <use href="#blush"/>
    <g stroke="#8A5236" stroke-linecap="round" fill="none">
      <path d="M147 274 Q160 258 173 274 M227 274 Q240 258 253 274" stroke-width="5"/>
      <path d="M182 292 C184 324 216 324 218 292 Z" fill="#F29C9C" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <use href="#sparkle" transform="translate(80 200)"/>
    <use href="#sparkle" transform="translate(330 175) scale(1.3)"/>
    <use href="#sparkle" transform="translate(345 260) scale(0.7)"/>
  </g>
  <text x="1270" y="580" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#6B3F28">成功 · Hoàn thành</text>

  <!-- ===== Bảng màu ===== -->
  <g font-family="Segoe UI, sans-serif" font-size="14" fill="#6B3F28">
    <text x="640" y="640" font-size="18" font-weight="600">Bảng màu</text>
    <g transform="translate(640 660)">
      <rect width="44" height="44" rx="8" fill="#8A5236"/><text x="0" y="64">Viền</text>
      <rect x="90" width="44" height="44" rx="8" fill="#F8ECE6" stroke="#ddd"/><text x="90" y="64">Lông</text>
      <rect x="180" width="44" height="44" rx="8" fill="#EBCDBD"/><text x="180" y="64">Trong tai</text>
      <rect x="270" width="44" height="44" rx="8" fill="#F3B6A3"/><text x="270" y="64">Má hồng</text>
      <rect x="360" width="44" height="44" rx="8" fill="#4B4648"/><text x="360" y="64">Vest</text>
      <rect x="450" width="44" height="44" rx="8" fill="#A65A33"/><text x="450" y="64">Cà vạt</text>
      <rect x="540" width="44" height="44" rx="8" fill="#5B8FD6"/><text x="540" y="64">Thẻ NV</text>
    </g>
  </g>
</svg>
